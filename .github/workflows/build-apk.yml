name: Build Family GPS Tracker APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK with version
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/FamilyGPSTracker-v1.0.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGPSTracker-v1.0.0-debug
          path: output/FamilyGPSTracker-v1.0.0-debug.apk
